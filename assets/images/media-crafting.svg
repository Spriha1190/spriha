<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title-craft">
  <title id="title-craft">Editorial illustration of handmade paper origami blooms, silk ribbon, and golden craft accents</title>
  <defs>
    <linearGradient id="linenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5F0"/>
      <stop offset="100%" stop-color="#EEDCE4"/>
    </linearGradient>
    <linearGradient id="silkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#881344"/>
      <stop offset="50%" stop-color="#D9468F"/>
      <stop offset="100%" stop-color="#A61B55"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#linenBg)"/>
  <!-- Flowing Silk Ribbon -->
  <path d="M-20,440 C160,360 280,520 440,420 C590,325 690,465 830,370" fill="none" stroke="url(#silkGrad)" stroke-width="26" stroke-linecap="round" opacity="0.88"/>
  <path d="M-20,440 C160,360 280,520 440,420 C590,325 690,465 830,370" fill="none" stroke="#FCE7F0" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- Artisan Paper Mat -->
  <rect x="170" y="95" width="460" height="330" rx="24" fill="#FFFFFF" stroke="#E0CCD6" stroke-width="2"/>
  <rect x="190" y="115" width="420" height="290" rx="16" fill="#FCF7F9" stroke="#B38147" stroke-opacity="0.45" stroke-dasharray="6 6" stroke-width="1.5"/>
  <!-- Origami Rose Centerpiece -->
  <g transform="translate(345,250)">
    <polygon points="0,-90 58,-22 36,68 -36,68 -58,-22" fill="#A61B55" opacity="0.92"/>
    <polygon points="0,-72 44,-14 26,52 -26,52 -44,-14" fill="#D9468F" opacity="0.88"/>
    <polygon points="0,-46 28,-8 16,32 -16,32 -28,-8" fill="#F9A8D4"/>
    <circle cx="0" cy="-4" r="14" fill="#E6BC82"/>
  </g>
  <!-- Paper Botanical Leaves & Gold Thread -->
  <polygon points="455,215 545,165 510,265" fill="#355E4B" opacity="0.88"/>
  <polygon points="462,255 560,268 485,320" fill="#4D7C66" opacity="0.82"/>
  <circle cx="520" cy="355" r="34" fill="none" stroke="#B38147" stroke-width="5"/>
  <circle cx="520" cy="355" r="22" fill="none" stroke="#E6BC82" stroke-width="3"/>
  <circle cx="245" cy="175" r="22" fill="#F472B6" opacity="0.35"/>
  <circle cx="245" cy="175" r="10" fill="#A61B55"/>
</svg>
