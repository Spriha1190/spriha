<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title-photo">
  <title id="title-photo">Editorial illustration of a classic rangefinder camera in golden sunlight with botanical shadows</title>
  <defs>
    <linearGradient id="bgPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF4EE"/>
      <stop offset="55%" stop-color="#F2E2E8"/>
      <stop offset="100%" stop-color="#E7CFD9"/>
    </linearGradient>
    <linearGradient id="sunBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9EF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFF9EF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brassBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6BC82"/>
      <stop offset="50%" stop-color="#C28D50"/>
      <stop offset="100%" stop-color="#9A6B34"/>
    </linearGradient>
    <linearGradient id="lensGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A61B55"/>
      <stop offset="45%" stop-color="#38182C"/>
      <stop offset="100%" stop-color="#1A0E17"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgPhoto)"/>
  <polygon points="0,0 560,0 800,450 220,600 0,340" fill="url(#sunBeam)"/>
  <!-- Botanical shadow silhouette -->
  <g opacity="0.16" fill="#2A1824">
    <path d="M620,60 C560,140 530,220 510,330 C565,255 620,185 695,120 Z"/>
    <path d="M685,150 C610,200 570,255 545,340 C610,285 660,235 745,190 Z"/>
    <path d="M580,25 C540,105 510,180 485,265 C525,205 555,140 615,85 Z"/>
  </g>
  <!-- Surface table shadow -->
  <ellipse cx="400" cy="445" rx="220" ry="30" fill="#24141F" opacity="0.14"/>
  <!-- Camera Body -->
  <rect x="205" y="210" width="390" height="225" rx="26" fill="#241620"/>
  <rect x="205" y="210" width="390" height="64" rx="22" fill="url(#brassBody)"/>
  <rect x="205" y="256" width="390" height="18" fill="#1A0F17"/>
  <!-- Shutter & Viewfinder -->
  <rect x="255" y="192" width="44" height="18" rx="6" fill="url(#brassBody)"/>
  <rect x="495" y="185" width="40" height="25" rx="6" fill="#1E141B" stroke="#E6BC82" stroke-width="2"/>
  <rect x="260" y="226" width="52" height="24" rx="6" fill="#1E141B" stroke="#FAF4EE" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="536" cy="238" r="10" fill="#A61B55"/>
  <!-- Lens Rings -->
  <circle cx="400" cy="336" r="102" fill="#180F16" stroke="#E6BC82" stroke-width="4"/>
  <circle cx="400" cy="336" r="84" fill="#2C1B26" stroke="#C28D50" stroke-width="2"/>
  <circle cx="400" cy="336" r="64" fill="url(#lensGlass)" stroke="#F472B6" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="400" cy="336" r="34" fill="#120A10" stroke="#E6BC82" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="378" cy="312" r="16" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="424" cy="360" r="8" fill="#F472B6" opacity="0.35"/>
  <!-- Delicate Rose Twig beside Camera -->
  <path d="M98,465 Q150,395 190,340" fill="none" stroke="#355E4B" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="136" cy="402" rx="22" ry="11" transform="rotate(-35 136 402)" fill="#355E4B" opacity="0.88"/>
  <circle cx="192" cy="334" r="22" fill="#A61B55"/>
  <circle cx="186" cy="328" r="13" fill="#F472B6" opacity="0.72"/>
  <circle cx="194" cy="336" r="5" fill="#E6BC82"/>
</svg>
